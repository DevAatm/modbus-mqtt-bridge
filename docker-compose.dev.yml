# Stack d'ESSAIS — ne pas utiliser en production (voir docker-compose.yml).
#
#   docker compose -f docker-compose.dev.yml --profile sim up --build
#
# 'sim' démarre un simulateur Modbus RTU relié au bridge par un port série
# virtuel (socat over TCP). Sans le profil 'sim', le bridge attend un vrai
# port série — non disponible dans Docker Desktop/Windows.
#
# 'sim-tcp' fait la même chose sur un lien Modbus TCP : ni socat ni PTY, le
# bridge ouvre une socket. Changer MODBUS_FRAMING + --framing (des deux côtés,
# ils doivent correspondre) pour simuler soit un équipement TCP natif
# ('socket'), soit une passerelle transparente TCP<->RS485 ('rtu').
#
#   docker compose -f docker-compose.dev.yml --profile sim-tcp up --build
#
# MQTT anonyme sur localhost:1883, Home Assistant sur http://localhost:8123

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    depends_on:
      - mosquitto
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    restart: unless-stopped

  modbus-sim:
    profiles: ["sim"]
    build:
      context: .
      target: dev
    entrypoint: ["/bin/sh", "/app/tools/sim-entrypoint.sh"]

  modbus-bridge:
    profiles: ["sim"]
    build:
      context: .
      target: dev
    depends_on:
      - mosquitto
      - modbus-sim
    entrypoint: ["/bin/sh", "/app/tools/bridge-sim-entrypoint.sh"]
    volumes:
      - ./profiles/sofar-esi-5k-s1.yaml:/etc/bridge/profile.yaml:ro
    environment:
      SERIAL_PORT: /tmp/rs485
      MQTT_HOST: mosquitto
      PROFILE: /etc/bridge/profile.yaml
      # Essais d'écriture : passer à "false" pour autoriser les commandes.
      READ_ONLY: "true"
      LOG_LEVEL: DEBUG          # essais : on trace chaque cycle de poll
      HEALTH_FILE: /tmp/bridge-health

  # --- Variante lien TCP -----------------------------------------------------
  modbus-sim-tcp:
    profiles: ["sim-tcp"]
    build:
      context: .
      target: dev
    command: ["python", "-m", "tools.modbus_sim", "tcp", "5020", "--framing", "socket"]

  modbus-bridge-tcp:
    profiles: ["sim-tcp"]
    build:
      # Lien TCP : ni socat ni PTY, donc l'image de production suffit telle quelle.
      context: .
      target: runtime
    depends_on:
      - mosquitto
      - modbus-sim-tcp
    volumes:
      - ./profiles/sofar-esi-5k-s1.yaml:/etc/bridge/profile.yaml:ro
    environment:
      MODBUS_TRANSPORT: tcp
      MODBUS_HOST: modbus-sim-tcp
      MODBUS_PORT: "5020"
      # 'socket' = équipement TCP natif ; 'rtu' = passerelle transparente.
      MODBUS_FRAMING: socket
      MQTT_HOST: mosquitto
      PROFILE: /etc/bridge/profile.yaml
      READ_ONLY: "true"
      LOG_LEVEL: DEBUG
      HEALTH_FILE: /tmp/bridge-health

  # --- Variante logger Solarman V5 -------------------------------------------
  # Le simulateur n'imite que l'enveloppe : il la désencapsule et relaie la
  # trame RTU à un vrai serveur Modbus interne. Valide l'intégration, pas le
  # format réel attendu par un LSW-3/LSE-3 physique.
  modbus-sim-solarman:
    profiles: ["sim-solarman"]
    build:
      context: .
      target: dev
    command: ["python", "-m", "tools.modbus_sim", "solarman", "8899", "--serial", "1234567890"]

  modbus-bridge-solarman:
    profiles: ["sim-solarman"]
    build:
      context: .
      target: runtime
    depends_on:
      - mosquitto
      - modbus-sim-solarman
    volumes:
      - ./profiles/sofar-esi-5k-s1.yaml:/etc/bridge/profile.yaml:ro
    environment:
      MODBUS_TRANSPORT: tcp
      MODBUS_HOST: modbus-sim-solarman
      MODBUS_FRAMING: solarman_v5
      # Port 8899 par défaut avec ce framing : inutile de le répéter.
      MODBUS_LOGGER_SERIAL: "1234567890"
      MQTT_HOST: mosquitto
      PROFILE: /etc/bridge/profile.yaml
      READ_ONLY: "true"
      LOG_LEVEL: DEBUG
      HEALTH_FILE: /tmp/bridge-health

volumes:
  ha-config:

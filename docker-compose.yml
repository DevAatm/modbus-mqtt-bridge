# --- Variante lien TCP -------------------------------------------------------
# Même image, même profil : seul le lien change. Ni `devices:` ni groupe
# dialout — le conteneur n'est plus qu'un client réseau.
#
# MODBUS_FRAMING n'est pas devinable : 'socket' pour un équipement Modbus TCP
# natif (en-tête MBAP), 'rtu' pour une passerelle transparente TCP<->RS485
# (Waveshare, Elfin, USR...) qui encapsule des trames RTU, 'solarman_v5' pour
# un logger Sofar/Solarman LSW-3/LSE-3 (port 8899, datagramme propriétaire —
# ajouter alors MODBUS_LOGGER_SERIAL). Un mauvais choix ne donne pas de valeurs
# fausses, il donne des timeouts.
#
# ATTENTION : Modbus TCP n'a aucune authentification. En série, l'accès
# physique faisait barrière ; sur le réseau, il faut un VLAN/segment isolé.

  modbus-bridge-tcp:
    build: .
    volumes:
      - ./profiles/sofar-esi-5k-s1.yaml:/etc/bridge/profile.yaml:ro
    environment:
      modbus_transport: tcp
      modbus_host: 192.168.1.50
      modbus_port: "502"
      modbus_framing: socket   # ou 'rtu' derrière une passerelle rs485
      modbus_timeout: "3"      # secondes ; la latence réseau n'est pas le 3.5t du rtu
      profile: /etc/bridge/profile.yaml
      read_only: "true"
      mqtt_host: mosquitto
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
